name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show toolchain
        run: swift --version
      - name: Codec-independent tests
        run: swift test --skip HEVCEncoderTests
      - name: Build local app bundle
        run: ./scripts/package-app.sh
      - name: Verify bundle signature
        run: codesign --verify --deep --strict --verbose=2 dist/PHIBALoop.app
